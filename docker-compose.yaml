# version: '3.8'

services:
  # 1. DATABASE: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: scriptify-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: "Asia/Ho_Chi_Minh" # ÉP MÚI GIỜ VIỆT NAM
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: scriptify
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - scriptify-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. BACKEND: Spring Boot HTTPS (8443)
  backend:
    build: ./backend
    container_name: scriptify-be
    restart: always
    ports:
      - "8443:8443"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./certificates/keystore.p12:/app/src/main/resources/keystore.p12
    environment:
      - TZ=Asia/Ho_Chi_Minh # QUAN TRỌNG: Để JWT Token khớp giờ với thực tế
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      # Cấu hình SSL
      - SERVER_PORT=8443
      - SERVER_SSL_KEY_STORE=file:/app/src/main/resources/keystore.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=123456
      - SERVER_SSL_KEY_ALIAS=scriptify
      - SERVER_SERVLET_CONTEXT_PATH=/api
    networks:
      - scriptify-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:8443/api/auth/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 3. FRONTEND: Nginx (Cổng 80)
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_R2_PUBLIC_URL=${VITE_R2_PUBLIC_URL}
    container_name: scriptify-fe
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scriptify-network

networks:
  scriptify-network:
    driver: bridge

volumes:
  mysql-data: