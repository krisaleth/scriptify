services:
  # 1. DATABASE: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: scriptify-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: scriptify
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - scriptify-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s 
      retries: 5
      start_period: 30s

  # 2. BACKEND: Spring Boot
  backend:
    build: ./backend
    container_name: scriptify-be
    restart: always
    ports:
      - "8443:8443"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Mount đơn giản vào thư mục gốc /app
      - ./certificates/keystore.p12:/app/keystore.p12
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      # Cấu hình SSL trỏ vào file vừa mount
      - SERVER_PORT=8443
      - SERVER_SSL_KEY_STORE=file:/app/keystore.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=123456
      - SERVER_SSL_KEY_ALIAS=scriptify
      - SERVER_SERVLET_CONTEXT_PATH=/api
    networks:
      - scriptify-network
    healthcheck:
      # Nếu Dockerfile dùng Alpine, hãy đảm bảo đã 'apk add curl'
      test: ["CMD-SHELL", "curl -k https://localhost:8443/api/auth/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 3. FRONTEND: Nginx
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_R2_PUBLIC_URL=${VITE_R2_PUBLIC_URL}
        - VITE_API_URL=https://localhost:8443/api
    container_name: scriptify-fe
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scriptify-network

networks:
  scriptify-network:
    driver: bridge

volumes:
  mysql-data: